<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card login-card">
                <div class="login-card-header">
                    <i class="fa-solid => fa-hotel fa-3x mb-3 text-light"></i>
                    <h3 class="fw-bold mb-1">Grand Stay Hotel</h3>
                    <p class="text-white-50 mb-0">Management Portal Login</p>
                </div>
                <div class="card-body p-4">

                    <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label font-weight-bold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="text" class="form-control" id="username" placeholder="Enter username" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label font-weight-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); border: none;">
                            <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
                        </button>
                    </form>

                    <hr class="my-4">

                    <div class="bg-light p-3 rounded border">
                        <h6 class="fw-bold mb-2 text-secondary"><i class="fa-solid fa-key me-1"></i> Quick Test Credentials:</h6>
                        <div class="d-flex justify-content-between text-muted small">
                            <span><strong>Admin:</strong> admin / admin123</span>
                            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="fillCreds('admin', 'admin123')">Use</button>
                        </div>
                        <div class="d-flex justify-content-between text-muted small mt-1">
                            <span><strong>Staff:</strong> staff / staff123</span>
                            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="fillCreds('staff', 'staff123')">Use</button>
                        </div>
                    </div>

                </div>
            </div>
            <p class="text-center text-white-50 mt-3 small">&copy; 2026 Grand Stay Hotel Management System</p>
        </div>
    </div>
</div>

<script>
    function fillCreds(user, pass) {
        document.getElementById('username').value = user;
        document.getElementById('password').value = pass;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const alertBox = document.getElementById('loginAlert');

        alertBox.classList.add('d-none');

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();
            if (data.success) {
                window.location.href = 'index.html';
            } else {
                alertBox.textContent = data.error || 'Invalid credentials';
                alertBox.classList.remove('d-none');
            }
        } catch (err) {
            alertBox.textContent = 'Server connection error. Please try again.';
            alertBox.classList.remove('d-none');
        }
    });

    // Check if already logged in
    fetch('/api/auth/me')
        .then(res => res.json())
        .then(data => {
            if (data.success && data.user) {
                window.location.href = 'index.html';
            }
        });
</script>
</body>
</html>
